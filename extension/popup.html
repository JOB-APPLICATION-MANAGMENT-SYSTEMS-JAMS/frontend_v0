<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JAMS Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="logo.png" alt="" class="mark" width="26" height="21" />
        <span class="wordmark">JAMS <em>Autofill</em></span>
      </div>
      <span id="who" class="who"></span>
    </header>

    <!-- signed out -->
    <form id="signin" class="pane">
      <p class="pane-title">Sign in</p>
      <div class="field">
        <label for="api">Backend</label>
        <select id="api">
          <option value="https://backend-v0-3aeu-omega.vercel.app/api/v1">Production</option>
          <option value="http://localhost:8000/api/v1">Local (localhost:8000)</option>
        </select>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" />
          <button type="button" id="peek" class="peek" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" /><circle cx="12" cy="12" r="2.6" />
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-3.4 4M6.6 7.9A17 17 0 0 0 2 12s3.5 6 10 6a9.6 9.6 0 0 0 3.6-.7M9.9 10.1a2.6 2.6 0 0 0 3.7 3.7" />
            </svg>
          </button>
        </div>
      </div>
      <button id="login" class="primary" type="submit">Sign in</button>
      <p class="fineprint">Your token stays in the extension — pages never see it.</p>
      <p class="fineprint">No account yet? <button type="button" id="signup" class="linklike">Create one on the web</button></p>
    </form>

    <!-- signed in -->
    <section id="app" class="pane" hidden>
      <!-- Jobright-style profile card: who you are + the door to editing it -->
      <div class="profile-card">
        <div class="avatar" id="avatar" aria-hidden="true">?</div>
        <div class="pinfo">
          <p class="pname" id="pname">Your profile</p>
          <p class="pmeta" id="pmeta">loading…</p>
        </div>
        <button id="edit" class="editbtn" type="button" title="Add or change the details autofill uses">✎ Edit</button>
      </div>

      <button id="fill" class="primary big" type="button">
        <span class="btn-label">Fill this page</span>
      </button>
      <p class="legend">
        <span class="dot green"></span> confident &nbsp;·&nbsp;
        <span class="dot amber"></span> review &nbsp;·&nbsp;
        <span class="dot none"></span> skipped
      </p>

      <!-- per-field breakdown: what filled, what didn't, and why -->
      <div id="breakdown" class="breakdown" hidden>
        <p class="btitle" id="btitle"></p>
        <ul id="fills" class="fills"></ul>
        <p class="bnote" id="bnote"></p>
      </div>

      <p id="result" role="status" aria-live="polite"></p>

      <button id="capture" class="secondary" type="button">Save this job to JAMS</button>
      <label class="check"><input type="checkbox" id="draft" checked /> Create an application draft (not submitted)</label>

      <p class="hint files">Resume, transcript and portfolio files must be attached by hand — extensions can’t upload files for you.</p>

      <div class="row footer">
        <button id="logout" class="ghost" type="button">Sign out</button>
        <span id="where" class="hint"></span>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
